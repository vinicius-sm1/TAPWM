    textarea {
  resize: none;

<body style="background-color:#ffffff;"></body>
    <h1 class="text-center">Formulário Principal</h6>
    <hr>
    <div class="container p-5 my-5 bg-info rounded">
        <form name="Formulario" onsubmit="return validar()">
            <label for="nome">Nome:</label><br>
            <input type="text"  name="nome" id="nome" size="40"><br>
            <label for="email">Email:</label><br>
            <input type="email" name="email" id="email" size="100"><br>
            <label for="comentarios">Comentarios:</label><br>
            <textarea name="comentarios" id="comentarios" rows="7" cols="50"></textarea><br>
            <center>
            <h3>Pesquisa:</h3>        
            <input type="radio" name="pesquisa" id="pesquisa1" value="sim">
            <label for="pesquisa1">Sim</label>
            <input type="radio" name="pesquisa" id="pesquisa2" value="nao">
            <label for="pesquisa2">Não</label><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpa">
            </center>
        </form>
    </div>
</body>
    <script src="atividade14.js"></script>
</html>
